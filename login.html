<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | SPEC</title>
    <link rel="stylesheet" href="css/loginstyle.css">
    <link rel="icon" href="css/img/iconlogo.ico" type="image/x-icon">
</head>





<body class="custom-cursor">

   
    <header>
        <div class="logo">
            <a href="index.html"> <img src="css/img/specmainwhite.png" alt="logo"></a>
        </div>

        <nav class="navbar">
            
            <ul>
                <li><a href="index.html">BACK</a></li>    
            </ul>
        </nav>
      
    </header>

    <br><br><br><br>

<div class="container">
    <div class="login-container">
        <h2 class="loginheader">LOG<span class="highlight"> IN</span></h2>

        <br>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <button type="submit">SIGN IN</button>
            <br><br>
        </form>
        <p id="error-message" style="color: red; display: none;">INVALID LOG IN</p>
    </div>



    <div class="logintag" id="logintag">
        <h2 id="line1"> Employee</h2>
        <h2 id="line2"> <span class="highlight">Portal </span>  </h2>
        

       
    </div>  

</div>

 <br><br><br><br><br><br><br><br><br><br>
 

    <footer class="footer">
        <div class="footer-content">
            <h2 class="footer-text">© 2024 Smart Power Electric Corp. All Rights Reserved. </h2>
            </div>   
    </footer>



    <script src="js/login.js"> </script>




</body>
</html>
